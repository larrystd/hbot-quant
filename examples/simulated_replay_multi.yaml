schema_version: 1
mode: simulated
loop_mode: blocking
replay_fixture: examples/replay_market_multi.json
storage_path: history.sqlite

accounts:
  - account: btc_account
    initial_balances:
      BTC: "0.02"
      USDT: "10"
  - account: eth_account
    initial_balances:
      ETH: "0.02"
      USDT: "10"

market_specs:
  - market: BTC-USDT
    exchange: simulated
    base_asset: BTC
    quote_asset: USDT
    tick_lot_size:
      price_per_tick: "0.01"
      amount_per_lot: "0.001"
      tick_lot_version: 1
    trading_rule:
      price_increment: "0.01"
      base_increment: "0.001"
      min_base_amount: "0.001"
      min_order_value: "0.01"
  - market: ETH-USDT
    exchange: simulated
    base_asset: ETH
    quote_asset: USDT
    tick_lot_size:
      price_per_tick: "0.01"
      amount_per_lot: "0.001"
      tick_lot_version: 1
    trading_rule:
      price_increment: "0.01"
      base_increment: "0.001"
      min_base_amount: "0.001"
      min_order_value: "0.01"

strategy_configs:
  - strategy_id: 1
    strategy: simple_pmm
    account: btc_account
    markets: [BTC-USDT]
    order_amount: "0.01"
    bid_spread: "0.001"
    ask_spread: "0.001"
    refresh_interval: 15s
  - strategy_id: 2
    strategy: simple_pmm
    account: eth_account
    markets: [ETH-USDT]
    order_amount: "0.01"
    bid_spread: "0.001"
    ask_spread: "0.001"
    refresh_interval: 15s

assignments:
  - shard: 0
    markets: [BTC-USDT]
    strategy_ids: [1]
    accounts: [btc_account]
  - shard: 1
    markets: [ETH-USDT]
    strategy_ids: [2]
    accounts: [eth_account]

risk_budgets:
  - account: btc_account
    asset: BTC
    shard: 0
    hard_limit: "0.02"
  - account: btc_account
    asset: USDT
    shard: 0
    hard_limit: "10"
  - account: eth_account
    asset: ETH
    shard: 1
    hard_limit: "0.02"
  - account: eth_account
    asset: USDT
    shard: 1
    hard_limit: "10"

rate_budgets:
  - account: btc_account
    shard: 0
    ip: local
    endpoint: order
    limit: 100
    cancel_reserve: 20
    window_us: 1000000
  - account: eth_account
    shard: 1
    ip: local
    endpoint: order
    limit: 100
    cancel_reserve: 20
    window_us: 1000000

rate_capacities:
  - account: btc_account
    ip: local
    endpoint: order
    limit: 100
    window_us: 1000000
  - account: eth_account
    ip: local
    endpoint: order
    limit: 100
    window_us: 1000000
